<style>
:root{--bg:#f8f8f8;--card:#fff;--ink:#2b2a4c;--muted:#8a8fa8;--pri:#3a3263;--line:#e5e5ea;--side:#12183a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;font-size:15px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:14px 14px}
header button{background:none;border:0;font-size:26px;color:var(--ink);cursor:pointer}
.who{text-align:right;font-size:13px;font-weight:600}.who small{display:block;color:var(--muted);font-weight:400}
main{padding:16px;max-width:900px;margin:auto}
h1{font-size:22px;margin:4px 0}h2{font-size:18px;margin:0 0 14px}
.sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.card{background:var(--card);padding:18px;margin-bottom:16px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.hero{background:linear-gradient(135deg,#dcecff,#c4cfff);padding:24px 18px;color:#2b2a4c;margin-bottom:16px;position:relative}
.avatar{width:96px;height:96px;border-radius:50%;background:#3a3263;color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;border:3px solid #fff;margin:0 auto;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.badge{display:block;width:max-content;margin:-12px auto 22px;background:#7ed321;color:#fff;font-weight:700;font-size:13px;padding:3px 14px;border-radius:20px;border:2px solid #fff;position:relative}
.hero h1{font-size:24px;margin-bottom:2px}.hero p{margin:2px 0 14px;font-weight:500}
.hero div.r{font-size:14px;margin:9px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border-radius:8px;color:#fff;text-align:center;padding:20px 6px;font-size:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;min-height:84px;border:0;font-family:inherit}
.tile span{font-size:20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lc{border:1px solid var(--line);border-radius:8px;padding:16px 8px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.lc b{display:block;font-size:17px;margin:6px 0 4px}.lc small{color:var(--muted);font-size:12.5px}.lc .ic{font-size:30px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:100%}
th{text-align:left;padding:12px 10px;border-bottom:1.5px solid var(--ink);white-space:nowrap}
td{padding:14px 10px;border-bottom:1px solid var(--line)}
td small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.ok{color:#198754;font-weight:700}.no{color:#dc3545;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:26px 8px}.empty b{display:block;color:#8e93b5;font-size:17px;margin:6px 0}
.cal{background:#1e2f66;color:#fff;margin:-18px -18px 18px;padding:18px}
.cal h2{margin:0 0 12px}.cal select{width:100%;padding:10px;border-radius:3px;border:1px solid #4a79e6;font-size:14px;font-family:inherit}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stats div{border-radius:10px;padding:12px;font-size:12px;color:#c00}.stats b{display:block;color:#222;font-size:19px;margin-top:6px}
.btn{background:var(--pri);color:#fff;border:0;padding:9px 12px;border-radius:3px;font-size:14px;cursor:pointer;font-family:inherit}
.btn.full{width:100%;margin-top:8px;padding:12px}
select.s{width:100%;padding:11px;border:1px solid #4a79e6;border-radius:3px;font-size:14px;background:var(--card);color:var(--ink);font-family:inherit}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.day{border:1px solid var(--line)}.day h3{margin:0;text-align:center;padding:20px 8px;font-size:18px}.day p{margin:0;text-align:center;color:var(--muted);padding:16px;border-top:1px solid var(--line);font-size:14px}
.note{background:#cff4fc;border:1px solid #9eeaf9;border-radius:4px;padding:18px;color:#055160;font-size:14px;line-height:1.8}
.note a{color:#0d6efd;text-decoration:none;display:block;line-height:1.9}
.big{text-align:center;font-size:24px;font-weight:700;padding:14px 4px}
.fee{background:#2e3192;color:#fff;border-radius:14px;text-align:center;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.12);overflow:hidden}.fee div{padding:20px 8px;font-weight:700;font-size:17px}.fee div+div{border-top:1px solid rgba(255,255,255,.3);font-size:18px}
.gbtn{background:#198754;color:#fff;border:0;border-radius:3px;padding:9px 12px;font-size:13.5px;cursor:pointer;font-family:inherit;min-width:92px}
.rt{width:auto;min-width:240px;max-width:360px;margin:4px 0 8px}.rt td{padding:11px 12px;border:1px solid var(--line)}.rt tr:nth-child(odd) td{background:rgba(128,128,128,.1)}.rt td:first-child{font-weight:600}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
#side{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:320px;background:var(--side);color:#e6e8f5;z-index:30;transform:translateX(-100%);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
body.open #side{transform:none}body.open #ov{display:block}
.logo{padding:16px;background:#18204a;text-align:center}.logo img{max-width:140px;height:auto;display:block;margin:0 auto}
.login-logo{text-align:center;margin-bottom:20px}.login-logo img{max-width:160px;height:auto;display:inline-block}
#side a{display:flex;align-items:center;gap:14px;padding:15px 16px;color:inherit;text-decoration:none;font-size:15px;cursor:pointer}
#side a.on{background:#0a0f2b}
#side .arr{margin-left:auto}.open-g>.arr{transform:rotate(90deg)}
.sm{display:none;background:#0a0f2b}.sm.show{display:block}
.sm a{padding:12px 16px 12px 24px;font-size:14px}.sm a::before{content:"·";opacity:.4}
.landing{padding:40px 16px 20px;text-align:center;max-width:460px;margin:0 auto}

.lcard{background:var(--card);margin-top:20px;padding:26px 20px;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.08)}

.bigbtn{display:block;width:100%;background:var(--pri);color:#fff;border:0;padding:13px;border-radius:4px;font-size:15px;cursor:pointer;font-family:inherit}
.si-wrap{padding:30px 16px;max-width:400px;margin:0 auto}
.si-card{background:var(--card);padding:26px 24px;border-radius:4px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.si-card h2{font-weight:600;text-align:center;margin:0 0 20px;font-size:18px}
.fld{margin-bottom:16px}
.fld label{font-size:13px;display:block;margin-bottom:6px;color:var(--muted)}
.fld input{width:100%;padding:10px;border:1px solid var(--line);border-radius:3px;font-size:14px;font-family:inherit;background:var(--card);color:var(--ink)}
.si-err{color:#dc3545;font-size:13px;margin:-8px 0 14px;display:none}
.rs-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:22px}.rs-title h2{margin:0;font-size:20px}
.rs-lbl{font-size:14px;display:block;margin-bottom:8px}
.rs-sel{width:100%;padding:11px;border:1px solid var(--line);border-radius:3px;font-size:14px;background:var(--card);color:var(--ink);font-family:inherit}
.rs-st h2{font-size:20px;margin:0 0 22px}
.rs-name{color:#4a5fd0;font-size:22px;font-weight:600;margin:0 0 14px}
.rs-li{font-size:16px;margin:0 0 14px;display:flex;gap:10px;align-items:center}.rs-li i{font-style:normal;width:22px;text-align:center;color:#3f51b5}
.rs table td,.rs table th{font-size:14.5px}
.rs tbody tr:nth-child(odd){background:rgba(128,128,128,.1)}
.rs tr.tot td{border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.rs-nb{text-align:center;color:#d9302c;font-size:14px;padding:14px 4px;border-bottom:1px solid var(--line)}.rs-nb a{color:#0d6efd;cursor:pointer;text-decoration:none}
.rs-gr h2{font-size:20px;margin:0 0 8px}.rs-gr table{font-size:13px}.rs-gr th{font-size:13px;padding:10px}.rs-gr td{padding:13px 10px}
.rs-eff{text-align:center;font-weight:600;font-size:13px;padding:14px 4px;border-bottom:1px solid var(--line)}
.rs-in{width:100%;min-width:70px;padding:8px;border:1px solid var(--line);border-radius:3px;font-size:14px;font-family:inherit;background:var(--card);color:var(--ink)}
.rs-ed .fld{margin-bottom:12px}.rs-ed table{min-width:640px}.rs-ed td{padding:6px 4px}.rs-ed th{padding:8px 4px}
.rs-x{background:#dc3545;color:#fff;border:0;border-radius:3px;padding:7px 10px;cursor:pointer;font-family:inherit}
.rs-btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.rs-gear{background:none;border:0;font-size:15px;opacity:.35;cursor:pointer;padding:6px;color:var(--ink)}
.pw-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.pw-box{background:var(--card);color:var(--ink);border-radius:6px;padding:20px;width:100%;max-width:320px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.pw-box h3{margin:0 0 12px;font-size:16px}.pw-box .rs-in{margin-bottom:10px}
</style>
</head>

<script>
var MENU=[
["dash","","Dashboard"],
["g","","Academic Management",[["calendar","Academic Calendar"],["course","Course Registration"],["clearance","Registration/Exam Clearance"],["routine","Routine"],["teaching","Teaching Evaluation"],["live","Live Results"],["improve","Improvement Apply"],["results","Academic Results"],["cert","Certificates & Transcripts"],["convo","Convocation Application"]]],

["g","","Student Services",[["transport","Transport Card Apply"],["hub","Student Hub"],["hall","Hall Management"],["laptop","Laptop Scheme"],["stuapp","Student Application"],["help","Help Desk"],["mentor","Mentor Meeting"]]],
["notice","","Notice Board"],["facil","","Facilities"],["logout","","Logout"]];
var TITLES={};
var EV=[["Advising & Registration","1 January – 7 January 2026"],["Orientation Program (Newly Admitted Students)","8 January 2026"],["Classes Start","10 January 2026"],["Eid-Al-Fitr Vacation*","19 March–23 March 2026"],["Mid-Examination","28 March–10 April 2026"],["Eid-Al-Adha Vacation*","26 May–31 May 2026"],["Preparatory Leave","5 June–7 June 2026"],["Final Examination","8 June–23 June 2026"],["Last Date of Grade Submission","27 June 2026"],["Publication of Semester Results","28 June 2026"],["Semester Break","28 June–30 June 2026"],["Advising & Registration of Next Semester","1 July–9 July 2026"],["Classes Start of Next Semester","11 July 2026"]];

var CL=[
  ["Spring 2025 (251)",1,1,1],
  ["Summer 2025 (252)",1,1,1],
  ["Fall 2025 (253)",1,1,1],
  ["Spring 2026 (261)",1,1,1],
  ["Summer 2026 (262)",1,0,0],
  ["Fall 2026 (263)",1,0,0]
];

/* --- REGISTERED COURSES SYNCED STORE --- */
var CR_KEY='diu_reg_courses_v1', CR_ED=false;
function getDefRegCourses(){
    return {
        sel: 4, // Default Summer 2026, 262
        sems: [
            { name: 'Spring 2025 (251)', courses: [] },
            { name: 'Summer 2025 (252)', courses: [] },
            { name: 'Fall 2025 (253)', courses: [] },
            { name: 'Spring 2026 (261)', courses: [] },
            {
                name: 'Summer 2026, 262',
                courses: [
                    ["SE 133","Software Development Capstone Project","3","RETAKE","45_L1 (Self Study)","Dr. Md. Fazla Elahe"],
                    ["SE 223","Database System","3","REGULAR","45_M (Self Study)","Tapushe Rabaya Toma"],
                    ["SE 224","Database System Lab","1","REGULAR","45_C2","Nusrat Jahan"],
                    ["SE 222","Computer Architecture","3","REGULAR","45_L","Engr. Fayazunnesa Chowdhury"],
                    ["AOL 101","Art of Living","3","REGULAR","45_B","Ms. Jakia Khanom"]
                ]
            },
            { name: 'Fall 2026 (263)', courses: [] }
        ]
    };
}

var CR_STORE = getDefRegCourses();

function crSave(){
    try{ localStorage.setItem(CR_KEY, JSON.stringify(CR_STORE)); }catch(e){}
    syncToCloud();
}

var unsubscribeCloud = null;

function loadCloudData(){
    try{
        if(window.fbDb && window.fbOnSnapshot){
            if(unsubscribeCloud) unsubscribeCloud();
            unsubscribeCloud = window.fbOnSnapshot(window.fbDoc(window.fbDb, "portalData", "mainStore"), function(docSnap){
                if(docSnap.exists()){
                    var cloudData = docSnap.data();
                    if(cloudData.live) LV_STORE = cloudData.live;
                    if(cloudData.results) RS = cloudData.results;
                    if(cloudData.courses) CR_STORE = cloudData.courses;
                    render();
                    rsPaint(true);
                }
            }, function(e){
                console.log('Realtime listener fallback/error', e);
            });
        }
    }catch(e){console.log('Cloud load error', e);}
}

async function syncToCloud(){
    try{
        if(window.fbDb){
            await window.fbSetDoc(window.fbDoc(window.fbDb, "portalData", "mainStore"), {
                live: LV_STORE,
                results: RS,
                courses: CR_STORE
            }, { merge: true });
        }
    }catch(e){console.log('Cloud save error', e);}
}

function crCur(){
    if(!CR_STORE.sems || !CR_STORE.sems.length) CR_STORE = getDefRegCourses();
    if(CR_STORE.sel < 0 || CR_STORE.sel >= CR_STORE.sems.length) CR_STORE.sel = 0;
    return CR_STORE.sems[CR_STORE.sel];
}
function crCell(i, j, el){
    var cur = crCur();
    if(cur.courses && cur.courses[i]){
        cur.courses[i][j] = el.value;
        crSave();
    }
}
function crAddRow(){
    var cur = crCur();
    if(!cur.courses) cur.courses = [];
    cur.courses.push(["NEW CODE","New Course Title","3","REGULAR","45_A","Teacher Name"]);
    crSave();
    if(CUR==='course') render();
}
function crDelRow(i){
    var cur = crCur();
    if(cur.courses && cur.courses[i]){
        cur.courses.splice(i,1);
        crSave();
        if(CUR==='course') render();
    }
}
function crSetName(el){
    var cur = crCur();
    cur.name = el.value;
    crSave();
    var selEl = document.getElementById('crSemSel');
    if(selEl && selEl.options[selEl.selectedIndex]){
        selEl.options[selEl.selectedIndex].text = el.value;
    }
}
function crAddSem(){
    var el = document.getElementById('crNewSem'), n = el && el.value ? el.value.trim() : '';
    if(!n){ if(el) el.focus(); return; }
    CR_STORE.sems.push({ name: n, courses: [] });
    CR_STORE.sel = CR_STORE.sems.length - 1;
    crSave();
    if(el) el.value = '';
    if(CUR==='course') render();
}
function crDelSem(){
    if(CR_STORE.sems.length < 2){ alert('At least one semester is required.'); return; }
    if(!confirm('Delete "'+crCur().name+'"?')) return;
    CR_STORE.sems.splice(CR_STORE.sel, 1);
    CR_STORE.sel = 0;
    crSave();
    if(CUR==='course') render();
}
function crSearch(){
    var selEl = document.getElementById('crSemSel');
    if(selEl){
        var v = parseInt(selEl.value, 10);
        if(!isNaN(v) && v >= 0 && v < CR_STORE.sems.length){
            CR_STORE.sel = v;
            crSave();
        }
    }
    if(CUR==='course') render();
}

function crEdRender(){
    if(!CR_ED) return '';
    var cur = crCur();
    var rows = (cur.courses || []).map(function(d, i){
        return '<tr>'+
        '<td><b>#'+(i+1)+'</b></td>'+
        '<td><input class="rs-in" value="'+rsEsc(d[0])+'" placeholder="Code" oninput="crCell('+i+',0,this)"></td>'+
        '<td><input class="rs-in" value="'+rsEsc(d[1])+'" placeholder="Title" oninput="crCell('+i+',1,this)"></td>'+
        '<td><input class="rs-in" value="'+rsEsc(d[2])+'" placeholder="Credit" oninput="crCell('+i+',2,this)"></td>'+
        '<td><input class="rs-in" value="'+rsEsc(d[3])+'" placeholder="Type" oninput="crCell('+i+',3,this)"></td>'+
        '<td><input class="rs-in" value="'+rsEsc(d[4])+'" placeholder="Section" oninput="crCell('+i+',4,this)"></td>'+
        '<td><input class="rs-in" value="'+rsEsc(d[5])+'" placeholder="Teacher" oninput="crCell('+i+',5,this)"></td>'+
        '<td><button class="rs-x" onclick="crDelRow('+i+')">✕</button></td>'+
        '</tr>';
    }).join('');

    return '<div class="card rs-ed"><h2>Review – Edit Registered Courses</h2>'+
    '<div class="fld"><label>New semester name</label><input class="rs-in" id="crNewSem" placeholder="e.g. Spring 2027, 271"></div>'+
    '<div class="rs-btns"><button class="btn" onclick="crAddSem()">＋ Add Semester</button><button class="rs-x" onclick="crDelSem()">Delete this semester</button></div>'+
    '<div class="fld"><label>Semester name (selected)</label><input class="rs-in" value="'+rsEsc(cur.name)+'" oninput="crSetName(this)"></div>'+
    '<div class="tw"><table><thead><tr><th>SL</th><th>Code</th><th>Title</th><th>Cr</th><th>Type</th><th>Sec</th><th>Teacher</th><th>Action</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="rs-btns" style="margin-top:12px"><button class="btn" onclick="crAddRow()">＋ Add Course</button><button class="btn" style="background:#198754" onclick="CR_ED=false;render()">Done</button></div></div>';
}

function T(h,rows,empty){return '<div class="tw"><table><thead><tr>'+h.map(function(x){return'<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+(rows||'')+'</tbody></table>'+(empty?'<div class="empty">'+empty+'</div>':'')+'</div>'}
function C(t,b){return '<div class="card">'+(t?'<h2>'+t+'</h2>':'')+b+'</div>'}
function E(t,s){return '<div class="empty"><span>ⓘ</span><b>'+t+'</b>'+(s||'')+'</div>'}
function tile(c,i,t,go){return '<button class="tile" style="background:'+c+'" onclick="go(\''+go+'\')"><span>'+i+'</span>'+t+'</button>'}
function lc(i,t,s){return '<div class="lc"><div class="ic">'+i+'</div><b>'+t+'</b><small>'+s+'</small></div>'}
function sem(){return '<div class="card" style="margin:0 0 16px;padding:14px"><label style="font-size:14px;display:block;margin-bottom:6px">Select Semester</label><select class="s"><option>Fall 2026, 263</option><option>Summer 2026, 262</option><option>Spring 2026, 261</option></select><button class="btn full" style="margin-top:10px">Search</button></div>'}

                ]
            },

var CUR='dash';

function render(){
    if(!IS_LOGGED_IN){ showLanding(); return; }
    var id = CUR;
    if(id==='logout'){ doLogout(); return; }
    var f = V[id];
    var appEl = document.getElementById('app');
    if(appEl) appEl.innerHTML = f ? f() : C(TITLES[id]||'Section',E('Data not Found!!'));
    document.querySelectorAll('#side a').forEach(function(a){ a.classList.toggle('on', a.dataset.id === id); });
    document.body.classList.remove('open');
    window.scrollTo(0,0);
}

function go(id){
    if(!IS_LOGGED_IN){ showLanding(); return; }
    CUR = id;
    try{ location.hash = id; }catch(e){}
    render();
}

var APP_READY=false, CREDS={id:'251-35-518',pw:'anikanik'};

function showLanding(){
    IS_LOGGED_IN = false;
    document.getElementById('authwrap').style.display = '';
    document.getElementById('appwrap').style.display = 'none';
    document.getElementById('landing').style.display = '';
    document.getElementById('signin').style.display = 'none';
    document.getElementById('siErr').style.display = 'none';
}

function showSignin(){
    document.getElementById('landing').style.display = 'none';
    document.getElementById('signin').style.display = '';
    document.getElementById('siErr').style.display = 'none';
    document.getElementById('siId').value = '';
    document.getElementById('siPw').value = '';
}

function doLogin(){
    var idv = (document.getElementById('siId').value||'').trim();
    var pwv = document.getElementById('siPw').value||'';
    if(idv === CREDS.id && pwv === CREDS.pw){
        IS_LOGGED_IN = true;
        document.getElementById('authwrap').style.display = 'none';
        document.getElementById('appwrap').style.display = '';
        if(!APP_READY){ 
            initApp(); 
            loadCloudData();
            APP_READY = true; 
        } else { 
            loadCloudData();
            go('dash'); 
        }
    } else {
        document.getElementById('siErr').style.display = 'block';
    }
}

function doLogout(){
    IS_LOGGED_IN = false;
    if(unsubscribeCloud) {
        unsubscribeCloud();
        unsubscribeCloud = null;
    }
    document.getElementById('appwrap').style.display = 'none';
    document.getElementById('authwrap').style.display = '';
    showLanding();
    CUR = 'dash';
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
}

var siPwEl = document.getElementById('siPw');
if(siPwEl) siPwEl.addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });

function initApp(){
    var s = '<div class="logo"><img src="logo.png" alt="DIU Logo"></div>';
    MENU.forEach(function(m,i){
        if(m[0]==='g'){
            s += '<a data-g="'+i+'">'+m[1]+' '+m[2]+'<span class="arr">›</span></a><div class="sm" id="g'+i+'">'+m[3].map(function(x){ TITLES[x[0]]=x[1]; return '<a data-id="'+x[0]+'" href="#'+x[0]+'">'+x[1]+'</a>'; }).join('')+'</div>';
        } else {
            TITLES[m[0]] = m[2];
            s += '<a data-id="'+m[0]+'" href="#'+m[0]+'">'+m[1]+' '+m[2]+'</a>';
        }
    });
    
    document.getElementById('side').innerHTML = s;
    document.querySelectorAll('#side a[data-id]').forEach(function(a){
        a.addEventListener('click', function(e){ e.preventDefault(); go(a.dataset.id); });
    });
    document.querySelectorAll('[data-g]').forEach(function(a){
        a.onclick = function(){
            var g = document.getElementById('g'+a.dataset.g);
            if(g) g.classList.toggle('show');
            a.classList.toggle('open-g');
        };
    });
    
    var tgEl = document.getElementById('tg'); if(tgEl) tgEl.onclick = function(){ document.body.classList.toggle('open'); };
    var ovEl = document.getElementById('ov'); if(ovEl) ovEl.onclick = function(){ document.body.classList.remove('open'); };
    
    window.addEventListener('hashchange', function(){
        if(!IS_LOGGED_IN) { showLanding(); return; }
        var h = (location.hash||'').slice(1);
        if(h && h !== CUR){ CUR = h; render(); }
    });
    
    go('dash');
}

showLanding();
</script>
